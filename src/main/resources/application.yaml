server:
  port: 8080
  forward-headers-strategy: native
  shutdown: graceful

spring:
  application:
    name: p-14054-2
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
  session:
    timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          show-components: always
        liveness:
          show-components: always
custom:
  temp:
    dir-path: /tmp
  gen:
    dir-path: ./var/gen

