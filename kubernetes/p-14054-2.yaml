apiVersion: v1
kind: Secret
metadata:
  name: p-14054-2-secret
type: Opaque
stringData:
  # Replace before applying. Prefer an external secret manager outside class exercises.
  DB_PASSWORD: CHANGE_ME
  REDIS_PASSWORD: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p-14054-2
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: p-14054-2
  template:
    metadata:
      labels:
        app: p-14054-2
    spec:
      imagePullSecrets:
        - name: github-registry-secret
      terminationGracePeriodSeconds: 45
      containers:
        - name: p-14054-2
          image: ghcr.io/jhs512/p-14054-2:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_HOST
              value: mysql-1-service
            - name: DB_NAME
              value: p_14054_2_prod
            - name: DB_USERNAME
              value: p14054
            - name: REDIS_HOST
              value: redis-1-service
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: p-14054-2-secret
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: p-14054-2-secret
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: generated-files
              mountPath: /gen
      volumes:
        - name: generated-files
          hostPath:
            path: /share/p-14054-2/gen
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: p-14054-2-service
spec:
  selector:
    app: p-14054-2
  ports:
    - name: http
      port: 8080
      targetPort: http
